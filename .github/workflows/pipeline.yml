name: Tourism MLOps Pipeline

on:
  push:
    branches:
      - main

jobs:

  # ==========================================
  # 1. DATA REGISTRATION
  # ==========================================
  register-dataset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Hugging Face Hub
        run: |
          pip install huggingface_hub

      - name: Upload Dataset to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])

          api.upload_file(
              path_or_fileobj="tourism.csv",
              path_in_repo="tourism.csv",
              repo_id="navtri12/tourism-dataset",
              repo_type="dataset"
          )

          print("Dataset uploaded successfully.")
          PY


  # ==========================================
  # 2. DATA PREPARATION
  # ==========================================
  data-prep:
    runs-on: ubuntu-latest
    needs: register-dataset

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Dependencies
        run: |
          pip install pandas numpy scikit-learn==1.6.1 joblib huggingface_hub

      - name: Create Required Directories
        run: |
          mkdir -p tourism_project/model_building

      - name: Run Data Preparation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python data_prep.py


  # ==========================================
  # 3. MODEL TRAINING
  # ==========================================
  model-training:
    runs-on: ubuntu-latest
    needs: data-prep

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Dependencies
        run: |
          pip install pandas numpy scikit-learn==1.6.1 joblib mlflow huggingface_hub cloudpickle

      - name: Create Required Directories
        run: |
          mkdir -p tourism_project/model_building

      - name: Train Models
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python train.py

      - name: Upload Trained Model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: tourism_project/model_building/best_model.joblib
